# Throwaway Rustpad for `npm run test:integration`.
#
# Not a managed stack: brought up, driven by the suite, destroyed afterwards.
# The suite calls every tool in the catalogue, replacements included, so
# nothing here may be a pad anybody is typing in.
#
# Bound to 127.0.0.1 only. Rustpad has no authentication at all — a pad id is
# the only thing standing between a document and whoever guesses it — which is
# exactly why this must not listen on anything but loopback.
services:
  rustpad:
    # Pinned by **digest**, not by a version tag, because upstream publishes no
    # version tags at all: `latest` is the only tag `ekzhang/rustpad` has ever
    # had. A bare `:latest` default would leave this repository with no
    # pin/drift split in either direction — the pull-request gate would float
    # with whatever was pushed last, and the weekly run would ask a question it
    # had already answered.
    #
    # Overridable so that weekly run can point at the moving `:latest` and
    # report drift without changing what the gate tests.
    image: ${RUSTPAD_IMAGE:-ekzhang/rustpad:latest@sha256:536b63883b2661f31de580df438427f2b799f9284bf9f908708ea3b5d231b585}
    environment:
      RUST_LOG: info
    ports:
      - '127.0.0.1:3030:3030'

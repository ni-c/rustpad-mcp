name: Bug report
description: Something behaves wrongly or breaks
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: 'rustpad-mcp version'
      placeholder: '0.1.0 (npm version, docker tag or commit)'
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: 'Rustpad version'
      description: Which build of Rustpad this server talks to (image tag or commit)?
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: 'Claude Code, Claude Desktop, Codex, MCP Inspector, …'
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you called, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: >-
        Tool result or stderr. Please redact internal hostnames and IPs — this
        issue is public, and pad content may be sensitive.
      render: text
